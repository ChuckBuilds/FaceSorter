# config.yaml — default values for the tuning controls in the sidebar.
detection:
  det_size: 640          # detector input resolution: 640 / 1024 / 1600
  min_confidence: 0.5    # faces below this detector score are ignored
  min_face_height: 40    # faces shorter than this (pixels) are ignored

clustering:
  eps: 0.5               # max cosine distance to link two faces (lower = stricter)
  min_samples: 2         # min faces to form a group; singletons go to Unsorted

output:
  dir: sorted_output     # default export folder (relative to the app)
